name: LRCLIB-check (tijdelijk)
on:
  push:
    branches: ['debug/lrclib-check']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Zoek nummers op in LRCLIB
        run: |
          raw() { echo "--- $1"; curl -sS -G "https://lrclib.net/api/$1" "${@:2}" -A "lyrics-app check" -w '\nHTTP %{http_code}\n' | cut -c1-300; }
          raw search --data-urlencode "track_name=Broke Out" --data-urlencode "artist_name=J. Cole"
          raw search --data-urlencode "q=Broke Out Cole"
          raw search --data-urlencode "q=J. Cole Fall Off"
          raw search --data-urlencode "artist_name=J. Cole" --data-urlencode "album_name=The Fall-Off"
          raw get --data-urlencode "track_name=Rein Me In (with Olivia Dean)" --data-urlencode "artist_name=Sam Fender" --data-urlencode "album_name=People Watching (Deluxe Edition)" --data-urlencode "duration=340"
          raw get --data-urlencode "track_name=Rein Me In (with Olivia Dean)" --data-urlencode "artist_name=Sam Fender" --data-urlencode "album_name=Rein Me In (with Olivia Dean)" --data-urlencode "duration=339"
          raw get --data-urlencode "track_name=Rein Me In" --data-urlencode "artist_name=Sam Fender" --data-urlencode "album_name=People Watching (Deluxe Edition)" --data-urlencode "duration=339"

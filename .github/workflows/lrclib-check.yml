name: LRCLIB-check (tijdelijk)
on:
  push:
    branches: ['debug/lrclib-check']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Zoek J. Cole op in LRCLIB (met opnieuw proberen)
        run: |
          raw() {
            for i in 1 2 3 4 5 6 7 8; do
              out=$(curl -sS -G "https://lrclib.net/api/search" "$@" -A "lyrics-app check" -w '\nHTTP %{http_code}')
              echo "$out" | grep -q 'HTTP 503' || break
              sleep 3
            done
            echo "--- $* (poging $i)"
            echo "$out" | head -c 1 >/dev/null
            echo "$out" | sed '$d' | jq -r 'if type=="array" then (if length==0 then "LEEG: 0 resultaten" else .[] | "\(.trackName) | \(.artistName) | \(.albumName) | \(.duration)s | synced=\(.syncedLyrics != null)" end) else . end' | head -12
            echo "$out" | tail -1
          }
          raw --data-urlencode "track_name=Broke Out" --data-urlencode "artist_name=J. Cole"
          raw --data-urlencode "q=Broke Out J. Cole"
          raw --data-urlencode "q=J. Cole The Fall-Off"
